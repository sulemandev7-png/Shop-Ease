<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-label="An empty shopping bag with a question mark">
  <!-- background blob -->
  <circle cx="160" cy="130" r="110" fill="#f1e9dd"/>
  <!-- ground shadow -->
  <ellipse cx="160" cy="232" rx="110" ry="9" fill="#1d2433" opacity="0.08"/>

  <!-- tilted, empty shopping bag -->
  <g transform="rotate(-8 160 150)">
    <path d="M128 92V72q0-24 32-24t32 24v20" fill="none" stroke="#1d2433" stroke-width="9" stroke-linecap="round"/>
    <rect x="96" y="84" width="128" height="140" rx="16" fill="#e2603d"/>
    <rect x="96" y="84" width="128" height="14" rx="7" fill="#c44b2b"/>
    <circle cx="128" cy="108" r="6" fill="#faf7f2"/>
    <circle cx="192" cy="108" r="6" fill="#faf7f2"/>
    <!-- question mark -->
    <text x="160" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" fill="#faf7f2" text-anchor="middle">?</text>
  </g>

  <!-- little sparkles -->
  <path d="M262 70v20M252 80h20" stroke="#2f7d6d" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 150v16M50 158h16" stroke="#e2603d" stroke-width="4" stroke-linecap="round"/>
</svg>
